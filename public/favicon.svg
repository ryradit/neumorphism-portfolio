<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Neumorphic Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Cyber Gradient for Logo -->
    <linearGradient id="neonGrad" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Bevel & Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-10" dy="-10" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.15"/>
      <feDropShadow dx="15" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Glow for the core symbol -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Neumorphic Base Squircle -->
  <rect x="48" y="48" width="416" height="416" rx="100" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Subtle Bevel Border -->
  <rect x="48" y="48" width="416" height="416" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="52" y="52" width="408" height="408" rx="96" fill="none" stroke="#1e293b" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Centered Futuristic "R" Monogram + AI Nodes -->
  <g filter="url(#neonGlow)">
    <!-- Monogram R Path -->
    <path d="M180 150H270C315 150 345 175 345 215C345 250 320 275 285 280L350 362H295L235 285H215V362H180V150ZM215 250H265C290 250 310 240 310 215C310 190 290 180 265 180H215V250Z" fill="url(#neonGrad)"/>
    
    <!-- Cybernetic Nodes & Connections -->
    <circle cx="180" cy="150" r="10" fill="#6366f1"/>
    <circle cx="270" cy="150" r="8" fill="#3b82f6"/>
    <circle cx="350" cy="362" r="10" fill="#10b981"/>
    <circle cx="180" cy="362" r="8" fill="#6366f1"/>
    <circle cx="345" cy="215" r="8" fill="#3b82f6"/>
    
    <!-- Accent Tech brackets representing code & engineering -->
    <path d="M130 180L90 256L130 332" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M382 180L422 256L382 332" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>
